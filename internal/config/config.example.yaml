# khealth configuration. `khealth --init-config` writes this file to
# ~/.config/khealth/config.yaml (%AppData%/khealth/config.yaml
# on Windows); ./khealth.yaml in the working directory is also picked up.
# Every key is optional and flags override the file (`khealth -h`).

kubeconfig: ~/.kube/config        # default: $KUBECONFIG / ~/.kube/config
context: ""                       # kubeconfig context (default: current-context)
namespace: ""                     # initial namespace filter ("" = all); 'n' changes it live
refresh: 30s                      # API refresh + light SSH collection interval
theme: auto                       # auto (ask the terminal for its background), light or dark; a terminal that does not answer reads as dark (--theme, KHT_THEME)
heavy_every: 6                    # every Nth refresh also collects journal logs, image lists, tarball manifests (R forces it)

ssh:
  enabled: true
  user: ubuntu                    # default: $USER
  key: ~/.ssh/id_ed25519          # default: ssh-agent, then ~/.ssh/id_{ed25519,ecdsa,rsa}
                                  # encrypted key: export KHT_SSH_PASSPHRASE; password auth: export KHT_SSH_PASSWORD
  password: ""                    # fallback if key auth fails; prefer --ask-pass (prompt) or KHT_SSH_PASSWORD
  ask_pass: false                 # prompt for the password at startup (also used for sudo/dzdo -S when NOPASSWD is not granted)
  port: 22
  sudo: true                      # false = never escalate (the user must be root)
  become: auto                    # how to become root: auto (try sudo, dzdo, doas per host), sudo, dzdo, doas, none
  become_password: ""             # only if the escalation password differs from the SSH one (or KHT_BECOME_PASSWORD)
  timeout: 20s
  address: InternalIP             # InternalIP | ExternalIP | Hostname (from the Node object)
  hosts:                          # per-node address overrides (node name -> host[:port])
    # cp-1: 192.168.1.10
  nodes: []                       # only SSH to these node names (empty = every node in the cluster)
    # - cp-1
  bastion: ""                     # jump host: user@host[:port]
  strict_host_key: true           # verify against known_hosts (false = accept anything); a key on file under any name is trusted for a new address or a VIP that moved
  accept_new_host_keys: true      # record a never-seen node's key in known_hosts on first contact (StrictHostKeyChecking=accept-new); a changed key still fails. false = refuse any host the file does not already hold
  known_hosts: ~/.ssh/known_hosts
  concurrency: 8
  nice: true                      # run the probe scripts under renice 19 + ionice best-effort-lowest on the nodes
  backoff: true                   # skip the next cycle for a node whose probe took > refresh/2 or is still running

etcd:
  backup_dirs: []                 # extra directories scanned for snapshot files on control-plane nodes (upstream clusters)
    # - /var/backups/etcd
  max_backup_age: 24h             # warn when the newest snapshot is older than this
  endpoint: ""                    # override https://127.0.0.1:2379
  ca_cert: ""                     # override certificate paths (external etcd / custom layouts)
  client_cert: ""
  client_key: ""

helm:
  check_updates: true             # look up newer chart versions (needs outbound HTTP; false for air-gapped)
  use_helm_repos: true            # also use the repos you added with `helm repo add` (repositories.yaml, incl. their
                                  # username/password, CA/client certs); helm's cached index is used when a fetch fails
  repos:                          # extra name -> Helm repo URL (no credentials) for repos not in your helm CLI list;
                                  # index.yaml is fetched hourly. Same-named charts in several repos are only matched
                                  # when the index entry's home/sources agree with the installed Chart.yaml
    # harbor-lib: https://harbor.example.com/chartrepo/library
  timeout: 15s

logs:
  lines: 400                      # journalctl -n per node
  since: "-24h"                   # journalctl --since

perf:                             # the tool's own footprint (docs/PERFORMANCE.md; P shows it live)
  log: ""                         # JSONL file, one record per refresh (--perf-log): API req/bytes, remote CPU per probe, local CPU
  pprof: ""                       # net/http/pprof listen address, e.g. 127.0.0.1:6060 (--pprof)
  watch_cache: true               # list with resourceVersion=0: served from the apiserver watch cache, no etcd quorum read
  protobuf: true                  # protobuf instead of JSON for typed lists (3-4x fewer bytes, cheaper for the apiserver)
  discovery_ttl: 5m               # cache API discovery + CRD definitions between refreshes (0 = every cycle)
  configz_ttl: 10m                # cache the per-node kubelet configz (0 = every cycle)
  denied_ttl: 10m                 # do not retry API calls the token was refused (403) or that do not exist for this long (R retries)

export:                           # e writes the findings report (JSON + XLSX, one sheet per benchmark); tools/findings -json/-xlsx headlessly
  dir: ""                         # directory for khealth-<context>-<timestamp>.json/.xlsx (--export-dir; default: the current directory)

namespaces:                       # what this deployment treats as infrastructure, on top of the built-ins (kube-*, cattle-*, longhorn-*, cert-manager, ...)
  system: []                      # extra system namespaces: exact names, or prefixes with a trailing - or * (platform-*, infra, logging); the PSA config's exempt namespaces count without being listed
  cni: []                         # extra CNI agent pod names/prefixes (kube-ovn-cni, kube-router) for the MTU and restart checks

actions:
  enabled: true                   # Helm tab: u = helm upgrade, b = helm rollback (always confirmed); --read-only disables
  helm_binary: helm               # helm CLI used for actions (with --kubeconfig/--kube-context of this session)

thresholds:
  disk_warn_pct: 80
  disk_crit_pct: 90
  inode_warn_pct: 80
  mem_warn_pct: 85
  mem_crit_pct: 95
  cpu_warn_pct: 85
  load_per_cpu_warn: 2.0
  restart_warn: 5                 # pod restarts (within 24h) that raise a warning
  pending_pod_age: 5m
  cert_expiry_warn: 720h          # 30 days
  clock_skew_warn: 5s
  etcd_db_warn_pct: 80            # db size as % of quota-backend-bytes
  etcd_fsync_warn_ms: 10
  etcd_frag_warn_pct: 50          # (db size - in use) / db size
  unused_images_gb: 5
