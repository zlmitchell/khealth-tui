# Noisy neighbour: "api" serves HTTP behind Traefik and holds a little
# more memory than it requests, at default priority. A minute after the
# lab starts, the high-priority "batch/report" Job takes 4 GiB: more than
# the whole headroom (compose.yaml), so it crosses the kubelet's
# memory.available threshold whatever the lab's baseline. The kubelet
# evicts pods it has no stats for first (crash-looping, pending), then
# pods above their request, lowest priority first: api goes before
# report, though report caused it. The traffic generator's requests
# through Traefik fail while api is gone. Needs a Docker VM of 8 GiB+.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata: {name: lab-high}
value: 1000
description: the noisy neighbour outranks the pod it pushes out
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: shop}
spec:
  replicas: 1
  selector: {matchLabels: {app: api}}
  template:
    metadata: {labels: {app: api}}
    spec:
      containers:
      - name: api
        image: busybox:1.36
        # ~40 MB held in a shell variable against a 16Mi request; the shell
        # stays (no exec) so the ballast stays with it
        command: ["sh","-c","ballast=$(head -c 40000000 /dev/zero | tr '\\0' a); mkdir -p /www; echo ok > /www/index.html; httpd -f -p 8080 -h /www & wait"]
        ports: [{containerPort: 8080}]
        resources: {requests: {memory: 16Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: api, namespace: shop}
spec:
  selector: {app: api}
  ports: [{port: 80, targetPort: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: api, namespace: shop}
spec:
  rules:
  - host: api.lab
    http:
      paths:
      - {path: /, pathType: Prefix, backend: {service: {name: api, port: {number: 80}}}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: traffic, namespace: shop}
spec:
  replicas: 1
  selector: {matchLabels: {app: traffic}}
  template:
    metadata: {labels: {app: traffic}}
    spec:
      containers:
      - name: curl
        image: busybox:1.36
        command: ["sh","-c","while true; do wget -q -O /dev/null -T 2 --header 'Host: api.lab' http://traefik.kube-system.svc/ || true; wget -q -O /dev/null -T 2 --header 'Host: api.lab' http://traefik.kube-system.svc/missing || true; sleep 0.5; done"]
        resources: {requests: {memory: 16Mi}}
---
apiVersion: v1
kind: Namespace
metadata: {name: batch}
---
apiVersion: batch/v1
kind: Job
metadata: {name: report, namespace: batch}
spec:
  backoffLimit: 0
  template:
    spec:
      priorityClassName: lab-high
      restartPolicy: Never
      containers:
      - name: report
        image: polinux/stress
        command: ["sh","-c","sleep 60; exec stress --vm 1 --vm-bytes 4096M --vm-hang 0 --timeout 150s"]
        resources: {requests: {memory: 64Mi}}
---
# Traefik (k3s's ingress) logs every request: the traffic view of the analysis
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata: {name: traefik, namespace: kube-system}
spec:
  valuesContent: |-
    logs:
      access:
        enabled: true
