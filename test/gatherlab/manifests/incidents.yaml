# Staged incidents, one per rca rule the check expects: an unreachable
# registry, an OOMKill, an unschedulable request, a failing liveness
# probe and a Pod Security rejection.
apiVersion: v1
kind: Namespace
metadata: {name: shop}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: badimage, namespace: shop}
spec:
  replicas: 1
  selector: {matchLabels: {app: badimage}}
  template:
    metadata: {labels: {app: badimage}}
    spec:
      containers: [{name: app, image: "registry.invalid.example/shop/api:1.4.2"}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: hungry, namespace: shop}
spec:
  replicas: 1
  selector: {matchLabels: {app: hungry}}
  template:
    metadata: {labels: {app: hungry}}
    spec:
      containers:
      - name: app
        image: busybox:1.36
        command: ["sh","-c","echo loading cache; tail /dev/zero"]
        resources: {limits: {memory: 24Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: huge, namespace: shop}
spec:
  replicas: 1
  selector: {matchLabels: {app: huge}}
  template:
    metadata: {labels: {app: huge}}
    spec:
      containers:
      - {name: app, image: busybox:1.36, command: ["sleep","3600"], resources: {requests: {cpu: "100"}}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: probed, namespace: shop}
spec:
  replicas: 1
  selector: {matchLabels: {app: probed}}
  template:
    metadata: {labels: {app: probed}}
    spec:
      containers:
      - name: app
        image: busybox:1.36
        command: ["sh","-c","echo serving; sleep 3600"]
        livenessProbe: {exec: {command: ["cat","/tmp/healthy"]}, periodSeconds: 3, failureThreshold: 2, initialDelaySeconds: 1}
        resources: {requests: {memory: 32Mi}}
---
apiVersion: v1
kind: Namespace
metadata:
  name: locked
  labels: {pod-security.kubernetes.io/enforce: restricted}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: privileged-agent, namespace: locked}
spec:
  replicas: 1
  selector: {matchLabels: {app: agent}}
  template:
    metadata: {labels: {app: agent}}
    spec:
      containers:
      - {name: agent, image: busybox:1.36, command: ["sleep","3600"], securityContext: {privileged: true}}
