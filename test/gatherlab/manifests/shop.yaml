# Workloads for the lab: healthy ones (web, healthy), a crash loop whose
# last log line names its dependency (db, which crashes first), and a
# Secret and an env value that must never reach a bundle (check.sh greps
# for both).
#
# Every pod requests more memory than it uses, so none of them is an
# eviction candidate: under memory pressure the kubelet evicts pods above
# their request first. Only the noisy-neighbour scenario (noisy.yaml)
# steps outside that on purpose.
apiVersion: v1
kind: Namespace
metadata: {name: shop}
---
apiVersion: v1
kind: Secret
metadata: {name: db, namespace: shop}
stringData: {password: hunter2-should-never-leak}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: shop}
spec:
  replicas: 2
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web}}
    spec:
      containers:
      - name: web
        image: busybox:1.36
        command: ["sh","-c","i=0; while true; do echo web tick $i; i=$((i+1)); sleep 2; done"]
        resources: {requests: {memory: 32Mi}}
        env:
        - {name: DB_PASSWORD, value: literal-secret-should-be-masked}
        - {name: LOG_LEVEL, value: debug}
---
# db crashes a little after start; crashy (below) names it in its error
apiVersion: apps/v1
kind: Deployment
metadata: {name: db, namespace: shop}
spec:
  replicas: 1
  selector: {matchLabels: {app: db}}
  template:
    metadata: {labels: {app: db}}
    spec:
      containers:
      - name: postgres
        image: busybox:1.36
        command: ["sh","-c","echo 'database system is starting up'; sleep 15; echo 'PANIC: could not write to file pg_wal/xlogtemp: No space left on device' >&2; exit 3"]
        resources: {requests: {memory: 32Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: db, namespace: shop}
spec:
  selector: {app: db}
  ports: [{port: 5432}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: crashy, namespace: shop}
spec:
  replicas: 1
  selector: {matchLabels: {app: crashy}}
  template:
    metadata: {labels: {app: crashy}}
    spec:
      containers:
      - name: app
        image: busybox:1.36
        command: ["sh","-c","sleep 25; echo starting; echo 'FATAL: cannot connect to db:5432' >&2; exit 1"]
        resources: {requests: {memory: 32Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: healthy, namespace: shop}
spec:
  replicas: 1
  selector: {matchLabels: {app: healthy}}
  template:
    metadata: {labels: {app: healthy}}
    spec:
      containers:
      - name: app
        image: busybox:1.36
        command: ["sh","-c","while true; do echo ok; sleep 5; done"]
        resources: {requests: {memory: 32Mi}}
