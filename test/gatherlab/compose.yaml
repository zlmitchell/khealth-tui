# Lab for --gather / --analyze and the TUI: a one-node k3s cluster with
# staged incidents. The node is a systemd container (node/Dockerfile) with
# k3s as a unit and sshd, so khealth reaches the same node over the API and
# over SSH. See README.md.
#
#   docker compose -f test/gatherlab/compose.yaml up -d --build      # the lab
#   docker compose -f test/gatherlab/compose.yaml --profile test run --rm check
#   docker compose -f test/gatherlab/compose.yaml down -v
#
# LAB_DATASTORE=sqlite runs k3s without --cluster-init (no etcd: state in
# SQLite through kine); the default is embedded etcd.
name: khealth-gatherlab

services:
  k3s:
    build: ./node
    hostname: lab-node
    # systemd as PID 1, like kind's node image; a private cgroup namespace
    # (kind's default on cgroup v2) so the kubelet counts the node's memory
    # only, not every container on the Docker VM
    privileged: true
    cgroup: private
    tmpfs: [/run, /run/lock, /tmp]
    environment:
      LAB_DATASTORE: ${LAB_DATASTORE:-etcd}
      # the kubelet's eviction threshold sits this far below the VM's
      # memory; the lab uses ~1.5 GiB of it, the 4 GiB noisy neighbour
      # crosses it
      LAB_EVICT_HEADROOM_MI: ${LAB_EVICT_HEADROOM_MI:-3584}
    # 16443 on both sides, so the kubeconfig k3s writes works from the host
    # as it is; the check service reaches the node as k3s (in the SANs)
    ports: ["16443:16443", "2222:22"]
    volumes:
      - ./out:/out
      # container storage off the overlay root, as kind does
      - /var/lib/rancher
      - /var/lib/kubelet
      # k3s applies whatever lands in its manifests directory
      - ./manifests/shop.yaml:/var/lib/rancher/k3s/server/manifests/lab-shop.yaml:ro
      - ./manifests/incidents.yaml:/var/lib/rancher/k3s/server/manifests/lab-incidents.yaml:ro
      - ./manifests/noisy.yaml:/var/lib/rancher/k3s/server/manifests/lab-noisy.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "k3s kubectl --kubeconfig /out/kubeconfig.yaml get --raw /readyz >/dev/null 2>&1 && systemctl is-active ssh >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 90

  # end-to-end check: build khealth from this checkout, gather, analyze,
  # and assert the expected root causes (check.sh)
  check:
    profiles: [test]
    image: golang:1.26
    depends_on:
      k3s: {condition: service_healthy}
    working_dir: /src
    environment:
      CGO_ENABLED: "0"
      LAB_SETTLE: ${LAB_SETTLE:-180}
      LAB_DATASTORE: ${LAB_DATASTORE:-etcd}
    volumes:
      - ../..:/src
      - gomod:/go/pkg/mod
      - gocache:/root/.cache/go-build
    entrypoint: ["sh", "/src/test/gatherlab/check.sh"]

# the check's Go caches: the lab's own, not build.sh's khealth-gomod /
# khealth-gocache, since `down -v` removes every volume declared here
volumes:
  gomod: {}
  gocache: {}
